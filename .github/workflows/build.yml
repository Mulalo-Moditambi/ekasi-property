name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  DOTNET_VERSION: "10.x"

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ekasi-property.slnx

      - name: Build
        run: dotnet build ekasi-property.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ekasi-property.slnx --configuration Release --no-restore --no-build

      - name: Publish
        run: dotnet publish ekasi-property.slnx --configuration Release --no-restore --no-build

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web.Client

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: 'npm'
          cache-dependency-path: src/Web.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Builds the deployable container (API + compiled SPA) and pushes it to GitHub's
  # registry, which Azure Container Apps pulls from. Gated behind both build jobs so a
  # failing test can never publish an image.
  publish-image:
    needs: [build-backend, build-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Provided automatically by Actions — nothing to configure.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Web.Api/Dockerfile
          push: true
          # Owner is lower-cased by hand: container registries reject uppercase repository
          # names, and the GitHub handle here contains capitals.
          tags: |
            ghcr.io/mulalo-moditambi/ekasi-api:latest
            ghcr.io/mulalo-moditambi/ekasi-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
