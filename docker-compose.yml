services:
  web-api:
    image: ${DOCKER_REGISTRY-}webapi
    container_name: web-api
    build:
      context: .
      dockerfile: src/Web.Api/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=EkasiP@ssw0rd!
    volumes:
      - ./.containers/db:/var/opt/mssql
    ports:
      - 1433:1433

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite
    # Bind to 0.0.0.0 so the emulator is reachable from the API container and the host
    # browser, which fetches the blob URLs the API hands out.
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
    volumes:
      - ./.containers/azurite:/data
    ports:
      - 10000:10000

  seq:
    image: datalust/seq:2024.3
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 8081:80
